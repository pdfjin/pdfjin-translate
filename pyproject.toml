[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfjin-translate"
version = "0.1.0"
authors = [
  { name="PDFJin Team", email="support@pdfjin.com" },
]
description = "Translate PDF text into over 100 languages with formatting overlay by PDFJin"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["pdf", "pdfjin", "cli", "pdf-tools", "document-processing", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Printing",
    "Topic :: Utilities",
]
dependencies = ["deep-translator>=1.11.0", "pdfplumber>=0.10.0", "pikepdf>=8.0.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
"Homepage" = "https://pdfjin.com"
"Online Tool" = "https://pdfjin.com/pages/translate-pdf.html"
"Source" = "https://github.com/pdfjin/pdfjin-translate"
"Bug Tracker" = "https://github.com/pdfjin/pdfjin-translate/issues"

[project.scripts]
pdfjin-translate = "pdfjin_translate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdfjin_translate*"]
